name: Streamer Status Tracker

on:
  repository_dispatch:
    types: [track_streamers]
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tracker
        run: python tracker.py
        
